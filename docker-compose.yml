services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: planpilot
      POSTGRES_USER: planpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-a-strong-password}
    volumes:
      - planpilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planpilot -d planpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://planpilot:${POSTGRES_PASSWORD}@db:5432/planpilot?schema=public
      APP_URL: ${APP_URL:-https://boardcue.draftapps.it}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_SOLO: ${STRIPE_PRICE_SOLO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_STUDIO: ${STRIPE_PRICE_STUDIO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SALES_EMAIL: ${SALES_EMAIL:-}
      SALES_BOOKING_URL: ${SALES_BOOKING_URL:-}
      CRON_SECRET: ${CRON_SECRET:-}
      USD_TO_EUR_FALLBACK: ${USD_TO_EUR_FALLBACK:-0.92}
      MONTHLY_FIXED_COST_EUR: ${MONTHLY_FIXED_COST_EUR:-30}
    expose:
      - "3000"

volumes:
  planpilot_postgres:
