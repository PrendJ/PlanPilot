services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: planpilot
      POSTGRES_USER: planpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-a-strong-password}
    volumes:
      - planpilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planpilot -d planpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://planpilot:${POSTGRES_PASSWORD}@db:5432/planpilot?schema=public
      APP_URL: ${APP_URL:-https://boardcue.draftapps.it}
      OPENROUTER_WORKSPACE_KEYS: ${OPENROUTER_WORKSPACE_KEYS:-{}}
    expose:
      - "3000"

volumes:
  planpilot_postgres:
