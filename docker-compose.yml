name: boardcue

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boardcue
      POSTGRES_USER: boardcue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-a-strong-password}
    volumes:
      - boardcue_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardcue -d boardcue"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://boardcue:${POSTGRES_PASSWORD}@db:5432/boardcue?schema=public
      APP_URL: ${APP_URL:-https://boardcue.draftapps.it}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_WORKSPACE_KEYS: ${OPENROUTER_WORKSPACE_KEYS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_SOLO: ${STRIPE_PRICE_SOLO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_STUDIO: ${STRIPE_PRICE_STUDIO:-}
      STRIPE_TAX_ENABLED: ${STRIPE_TAX_ENABLED:-true}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      AI_PROVIDER_ONLY: ${AI_PROVIDER_ONLY:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      APP_VERSION: ${APP_VERSION:-}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:-}
      LEGAL_VAT_NUMBER: ${LEGAL_VAT_NUMBER:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL:-}
      HOSTING_PROVIDER: ${HOSTING_PROVIDER:-}
      HOSTING_LOCATION: ${HOSTING_LOCATION:-}
      SMTP_PROVIDER_NAME: ${SMTP_PROVIDER_NAME:-}
      SMTP_PROVIDER_LOCATION: ${SMTP_PROVIDER_LOCATION:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SALES_EMAIL: ${SALES_EMAIL:-}
      SALES_BOOKING_URL: ${SALES_BOOKING_URL:-}
      CRON_SECRET: ${CRON_SECRET:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      USD_TO_EUR_FALLBACK: ${USD_TO_EUR_FALLBACK:-0.92}
      MONTHLY_FIXED_COST_EUR: ${MONTHLY_FIXED_COST_EUR:-60}
    expose:
      - "3000"

volumes:
  boardcue_postgres:
    name: boardcue_postgres
